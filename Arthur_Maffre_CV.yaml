cv:
  name: Arthur Maffre
  location: Montreal, QC
  email: maffrearthur@gmail.com
  phone: +1-514-501-7206
  website:
  social_networks:
    - network: LinkedIn
      username: arthur-maffre
    - network: GitHub
      username: arthurmaffre
  sections:
    Highlights:
      - bullet: Designing intelligent systems for real world impact
      - bullet: Finalist at **McGill-FIAM Hackathon** | 3rd place at **Polytechnique Datathon**
      - bullet: Bridging **AI theory** and real-world impact
    About Me:
      - 'Graduate student at **Mila** (Université de Montréal), building intelligent systems that push the **boundaries of optimization** and decision-making. Currently exploring **GFlowNet**-based architectures.'
    education:
      - institution: Université de Montréal - Mila
        area: Computer Science
        degree: MSC
        date:
        start_date: 2025-09
        end_date: 2027-08
        location: Montreal, QC, CA
        highlights:
          - Research on **GFlowNet**
          - Focus on reinforcement learning, **combinatorial optimization**, and AI planning  
      - institution: Université de Montréal
        area: Economics - Honours Program
        degree: BS
        date:
        start_date: 2022-09
        end_date: 2025-08
        location: Montreal, QC, CA
        summary:
        highlights:
          - Research assistant on a project supervised by Prof. Arbour
          - Worked in collaboration with the Chief Justice of the Quebec Superior Court *(**$5,000 IQRDJ** research grant) on **public institution spending** modeling*
          - Teaching assistant for * **Microeconomics I** (ECN-2040)*, a **core** 2nd-year under-graduate course'
          - '**GPA:** 3.825/4.3'
    research projects:
      - name: '[Conditional GFlowNet for Bilevel Knapsack](https://www.researchgate.net/publication/392064095_ECN_6338_Knapsack_GFlowNet)'
        date:
        start_date: 2025-03
        end_date: 2025-09
        location:
        summary: Honours Thesis – Université de Montréal (2024–2025)
        highlights:
          - '**Bilevel** knapsack pricing problem: the leader sets prices, the follower solves a knapsack problem to maximize utility'
          - '**Conditional GFlowNet**, conditioned on the leader''s decision, that successively proposes cuts for the master problem in a **Benders**-type approach'
          - Integrated mixed-integer programming with GFlowNet-based generation
      - name: 'LIBS Spectral Classification with a 1D Vision Transformer'
        date: Summer 2026
        location:
        summary: Research Internship – Institut Courtois, Université de Montréal (Prof. Mickaël Dollé)
        highlights:
          - Encoder-based classifier (**1D Vision Transformer**) for **LIBS** (laser-induced breakdown spectroscopy) spectra in solid-state chemistry
          - Saliency analysis to interpret predictions on samples
      - name: 'Corrections to *GFlowNet Foundations* (Bengio et al.)'
        date: '2026'
        location:
        summary:
        highlights:
          - Identified inconsistencies in **Appendix B** and corresponded with the authors
          - Acknowledged in the paper's acknowledgments
    personal projects:
      - name: 'Lab-in-the-loop Bayesian Optimization for Sensor Calibration'
        date:
        location:
        summary:
        highlights:
          - Estimated the bias of a load-cell scale with reference weights, using a **heteroscedastic Gaussian process** and an **Expected Information Gain** acquisition function
          - Low-cost testbed with known ground truth to validate a lab-in-the-loop optimization pipeline
      - name: 'Quadcopter Drone with a PPO Stabilization Policy'
        date:
        location:
        summary:
        highlights:
          - Built the drone hardware, the control code and the simulator from scratch to train a **PPO** stabilization policy
      - name: 'Controlled Growth Chamber'
        date:
        location:
        summary:
        highlights:
          - Built a humidity and temperature controlled chamber with **PID loops**, sensors and a control display
          - Prototyped a learned **world model** of the system dynamics to tune the PID controllers (validated in testing, not yet deployed)
    technical skills:
      - label: Languages
        details: Python (advanced), LaTeX, Markdown, Bash, C (basic), Rust (beginner)
      - label: Machine Learning & Optimization Framework
        details: PyTorch, Lightning AI, HuggingFace
      - label: Models
        details: 'Reinforcement Learning (PPO, A2C), GFlowNet, PINNs, XGBoost'
      - label: Tools & Dev environment
        details: 'Git, Conda, Docker, JupyterLab'
      - label: Spoken Languages
        details: French (native), English (fluent)
    Competitions:
      - name: '[McGill-FIAM Asset Management Hackathon - Finalist](#)'
        date: 2024-11
        start_date:
        end_date:
        location: Montreal
        highlights:
          - Top 10 out of 66 teams
          - Built a **Portfolio Transformer** model that directly outputs allocation actions rather than predictions
          - The objective function was the **Sharpe ratio**, optimized dynamically with transaction cost constraints
      - name: '[Polytechnique Montreal Datathon - 3rd Place](#)'
        date: 2024-12
        start_date:
        end_date:
        location: Montreal
        summary:
        highlights:
          - Designed an AI system to generate **financial reports** and commentary from raw data
          - 'Awarded a **$500** prize'
    extracurricular_activities:
      - bullet: Practice **Rinzai Zen** meditation several times a week at a Montreal centre
      - bullet: Enjoy long walks and hiking, and occasional rock climbing
      - bullet: Passionate about human interaction, I value active listening and building strong relationships in the workplace.

design:
